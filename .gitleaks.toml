# Gitleaks config for goDoggyDate.
# History contains only test-mode Stripe (sk_test) + public-by-design Firebase
# (NEXT_PUBLIC_) keys; the dangerous serviceAccountKey.json was never committed.
[extend]
useDefault = true

[allowlist]
description = "Placeholder values and build artifacts (confirmed false positives)"
paths = [
    '''\.env\.example''',          # template file — placeholders only
    '''.*\.next/cache/.*''',       # Next.js build cache (env values inlined at build)
    '''.*/\.next/cache/.*''',
    # CocoaPods lock file: every entry is "<PodName>: <40-char SHA-1 checksum
    # of the podspec>", e.g. "AppAuth: d4f13a8fe...". The hex checksums trip
    # gitleaks' generic-api-key entropy rule but are pod content hashes, not
    # credentials — confirmed by inspecting the flagged lines.
    '''.*/?Podfile\.lock''',
]
regexes = [
    '''(sk|pk|rk)_test_placeholder''',
    '''firebase_placeholder''',
    '''whsec_placeholder''',
    '''-----BEGIN PRIVATE KEY-----\\n\.\.\.\\n-----END PRIVATE KEY-----''',
    # Firebase WEB API key — public by design (shipped in every client
    # bundle; security comes from Firestore rules, not key secrecy).
    '''AIzaSyBUb1-qlQrGZ4bKEJSGWYldw0Ovz0mET3k''',
    # Stripe PUBLISHABLE keys only (pk_live_/pk_test_) — safe to embed in
    # client apps by design, unlike sk_live_/rk_live_ secret keys, which
    # this regex does not match.
    '''pk_(live|test)_[A-Za-z0-9]+''',
]
